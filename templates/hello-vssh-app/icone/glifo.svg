<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hello vssh-app">
  <title>Hello vssh-app</title>
  <!--
    Um bloco de tufo, a pedra porosa que dá nome ao Tuff: o primeiro bloco do app de quem começa. As
    três faces seguem a luz do alto à esquerda, com a de cima mais clara e a da direita mais escura,
    e os poros marcam as faces do lado. O azul é o do template Python; o template Node usa o mesmo
    bloco em verde. Troque este glifo pelo do seu app.

    Este arquivo é o glifo do ícone em camadas (`icone` no vssh-app.json): o fundo, a máscara e o
    fio da borda são do ambiente, e o glifo traz só o desenho, com o fundo transparente. A grade, a
    luz e a paleta estão em docs/guias/icone.md. O `icon.svg` que o manifesto também declara sai
    montado pelo `vssh-app-publish`, para um portal anterior às camadas.

    Os ids levam o prefixo `bloco-`. Quem puser dois glifos inline na mesma página não vê o degradê
    de um pintar o outro.
  -->
  <defs>
    <linearGradient id="bloco-topo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc4ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
    <linearGradient id="bloco-esquerda" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#2d5fc4"/></linearGradient>
    <linearGradient id="bloco-direita" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d5fc4"/><stop offset="1" stop-color="#1d3f8a"/></linearGradient>
  </defs>
  <path d="M32 11 51 22 32 33 13 22z" fill="url(#bloco-topo)"/>
  <path d="M13 22 32 33v21L13 43z" fill="url(#bloco-esquerda)"/>
  <path d="M51 22 32 33v21l19-11z" fill="url(#bloco-direita)"/>
  <path d="M15.6 22.2 32 12.7" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  <g fill="#000" fill-opacity=".18"><circle cx="20" cy="33" r="1.4"/><circle cx="25" cy="40.5" r="1"/><circle cx="41" cy="38" r="1.5"/><circle cx="45" cy="31" r="1"/><circle cx="36.5" cy="45" r="1.1"/></g>
  <g fill="#fff" fill-opacity=".28"><circle cx="30" cy="20" r="1.2"/><circle cx="37" cy="23" r="0.9"/></g>
</svg>
