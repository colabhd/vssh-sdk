<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palco</title>
  <!-- O SDK, o Tuff, o palco.css e o palco.js entram pelo `web.spa` do backend, que os injeta
       aqui e carimba os arquivos do app com o hash do conteúdo. -->
</head>
<body>

<div class="janela" id="janela">
  <div class="miolo">

    <!-- O palco: o vídeo, a tela de uma música, ou o início. -->
    <section class="palco tuff-palco" id="palco" aria-label="Reprodução">
      <video id="video" playsinline preload="metadata"></video>

      <div class="musica" id="musica" hidden>
        <div class="capa capa--grande" id="musica-capa">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-audio"></use></svg>
          <img alt="" hidden>
        </div>
        <div class="musica-titulo" id="musica-titulo"></div>
        <div class="musica-artista" id="musica-artista"></div>
        <div class="musica-album" id="musica-album"></div>
      </div>

      <div class="inicio" id="inicio">
        <div class="tuff-vazio">
          <div class="tuff-vazio-titulo">Nada tocando</div>
          <div class="tuff-vazio-msg">Abra um vídeo ou uma música, ou arraste um arquivo para cá.</div>
          <div class="tuff-acoes">
            <button class="tuff-btn tuff-btn--primario" id="btn-abrir">
              <svg class="tuff-ico" aria-hidden="true"><use href="#ico-folder-open"></use></svg>Abrir arquivo
            </button>
          </div>
        </div>
        <section class="continuar" id="continuar" hidden aria-labelledby="continuar-titulo">
          <h2 class="continuar-titulo" id="continuar-titulo">Continuar</h2>
          <ul class="continuar-lista" id="continuar-lista"></ul>
        </section>
      </div>

      <div class="retomar" id="retomar" hidden>
        <span>Continuando de <b id="retomar-t">0:00</b></span>
        <button class="tuff-btn" id="btn-do-inicio">Do início</button>
      </div>

      <div class="preparando" id="preparando" hidden>
        <span class="tuff-spinner"></span><span id="preparando-t">Preparando…</span>
      </div>

      <div class="aviso" id="aviso" role="status" hidden>
        <svg class="tuff-ico" aria-hidden="true"><use href="#ico-warning"></use></svg>
        <span id="aviso-t"></span>
      </div>
    </section>

    <!-- A fila: a pasta do que está tocando, em ordem. -->
    <aside class="fila" id="fila" hidden aria-label="Fila">
      <header class="fila-topo">
        <span class="fila-pasta" id="fila-pasta"></span>
        <button class="tuff-btn tuff-btn--icone" id="btn-pasta" aria-label="Mostrar no gerenciador de arquivos"
                data-tuff-dica="Mostrar no gerenciador de arquivos">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-folder-open"></use></svg>
        </button>
      </header>
      <input class="tuff-busca fila-busca" type="search" id="fila-busca" placeholder="Filtrar"
             aria-label="Filtrar a fila por nome" hidden>
      <ul class="fila-lista" id="fila-lista" role="listbox" aria-label="Arquivos da pasta"></ul>
    </aside>
  </div>

  <!-- O transporte: o tempo em cima, os comandos embaixo. Fica na tela o tempo todo, fora da tela
       cheia, porque a mídia continua tocando enquanto a pessoa olha a fila. -->
  <footer class="tuff-transporte transporte" id="transporte">
    <div class="tuff-transporte-tempo">
      <span class="tuff-tempo" data-tuff-tempo-atual>0:00</span>
      <div class="tuff-trilha" data-tuff-trilha aria-label="Posição"></div>
      <span class="tuff-tempo" data-tuff-tempo-total>--:--</span>
    </div>

    <div class="tuff-transporte-controles">
      <div class="tuff-transporte-inicio agora">
        <div class="capa capa--pequena" id="agora-capa">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-video"></use></svg>
          <img alt="" hidden>
        </div>
        <div class="agora-texto">
          <div class="agora-titulo" id="agora-titulo">Nada tocando</div>
          <div class="agora-sub" id="agora-sub"></div>
        </div>
      </div>

      <div class="tuff-transporte-meio">
        <button class="tuff-btn tuff-btn--icone sec" id="btn-aleatorio" aria-pressed="false"
                aria-label="Aleatório" data-tuff-dica="Aleatório">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-shuffle"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone" id="btn-anterior" aria-label="Anterior"
                data-tuff-dica="Anterior">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-skip-back"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone sec" id="btn-voltar" aria-label="Voltar 10 segundos"
                data-tuff-dica="Voltar 10 s (←)">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-voltar-10"></use></svg>
        </button>
        <button class="tuff-btn play" id="btn-play" data-tuff-play aria-label="Reproduzir">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-play"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone sec" id="btn-avancar" aria-label="Avançar 10 segundos"
                data-tuff-dica="Avançar 10 s (→)">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-avancar-10"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone" id="btn-proximo" aria-label="Próximo"
                data-tuff-dica="Próximo">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-skip-forward"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone sec" id="btn-repetir" aria-pressed="false"
                aria-label="Repetir" data-tuff-dica="Repetir">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-repeat"></use></svg>
        </button>
      </div>

      <div class="tuff-transporte-fim">
        <button class="tuff-btn tuff-btn--icone" id="btn-faixas" aria-label="Áudio e legendas"
                data-tuff-dica="Áudio e legendas" hidden>
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-subtitles"></use></svg>
        </button>
        <button class="tuff-btn veloc sec" id="btn-veloc" aria-label="Velocidade"
                data-tuff-dica="Velocidade">1×</button>
        <div class="tuff-volume" data-tuff-volume>
          <button class="tuff-btn tuff-btn--icone" id="btn-mudo" data-tuff-mudo aria-label="Silenciar"
                  data-tuff-dica="Silenciar (M)">
            <svg class="tuff-ico" aria-hidden="true"><use href="#ico-volume-on"></use></svg>
          </button>
          <div class="tuff-volume-trilha sec" aria-label="Volume">
            <div class="tuff-volume-trilho"><div class="tuff-volume-nivel"></div></div>
          </div>
        </div>
        <button class="tuff-btn tuff-btn--icone" id="btn-fila" aria-pressed="false" aria-label="Fila"
                data-tuff-dica="Fila">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-list"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone" id="btn-tela" aria-label="Tela cheia"
                data-tuff-dica="Tela cheia (F)">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-fullscreen"></use></svg>
        </button>
        <button class="tuff-btn tuff-btn--icone dica-direita" id="btn-mais" aria-label="Mais opções"
                data-tuff-dica="Mais opções">
          <svg class="tuff-ico" aria-hidden="true"><use href="#ico-more"></use></svg>
        </button>
      </div>
    </div>
  </footer>
</div>

</body>
</html>
