<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lupa">
  <title>Lupa</title>
  <!--
    A lente e o cabo. As formas são duas, porque a 22 px um terceiro elemento vira sujeira. O vidro
    é a cor do app, um ciano que nenhum outro ícone do ambiente usa, mais claro onde a luz bate e com
    o reflexo curvo no alto à esquerda. O aro e o cabo são o branco quente da família, e escurecem
    para longe da luz.

    A caixa do desenho vai de 9 a 56 nos dois eixos, e o centro dela cai no centro do quadro: a lente
    sobe e vai para a esquerda o que o cabo desce e vai para a direita.

    Este arquivo é o glifo do ícone em camadas (`icone` no vssh-app.json): o fundo, a máscara e o
    fio da borda são do ambiente, e o glifo traz só o desenho, com o fundo transparente. A grade, a
    luz e a paleta estão em docs/guias/icone.md. O `icon.svg` que o manifesto também declara sai
    montado pelo `vssh-app-publish`, para um portal anterior às camadas.

    Os ids levam o prefixo `lupa-`. Quem puser dois glifos inline na mesma página não vê o degradê
    de um pintar o outro.
  -->
  <defs>
    <radialGradient id="lupa-vidro" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#8ce6ef" stop-opacity=".6"/><stop offset=".6" stop-color="#3fc1d0" stop-opacity=".38"/><stop offset="1" stop-color="#1d8794" stop-opacity=".55"/></radialGradient>
    <linearGradient id="lupa-aro" gradientUnits="userSpaceOnUse" x1="12" y1="12" x2="42" y2="42"><stop offset="0" stop-color="#fffbf2"/><stop offset="1" stop-color="#d4cdbd"/></linearGradient>
    <linearGradient id="lupa-cabo" gradientUnits="userSpaceOnUse" x1="39" y1="39" x2="53" y2="53"><stop offset="0" stop-color="#ece6d8"/><stop offset="1" stop-color="#b8b0a0"/></linearGradient>
    <clipPath id="lupa-dentro"><circle cx="27" cy="27" r="12"/></clipPath>
  </defs>
  <path d="M39 39l13 13" stroke="url(#lupa-cabo)" stroke-width="8" stroke-linecap="round"/>
  <path d="M40.4 39.2l10.4 10.4" stroke="#fff" stroke-opacity=".2" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="27" cy="27" r="15" fill="url(#lupa-vidro)"/>
  <g clip-path="url(#lupa-dentro)">
    <path d="M17.6 27.5a9.6 9.6 0 0 1 9.4-9.9" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="35.5" cy="34.5" r="11" fill="#0d5560" fill-opacity=".22"/>
  </g>
  <circle cx="27" cy="27" r="15" fill="none" stroke="url(#lupa-aro)" stroke-width="6"/>
  <path d="M15.4 20.5a13.4 13.4 0 0 1 8.6-6.9" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
</svg>
