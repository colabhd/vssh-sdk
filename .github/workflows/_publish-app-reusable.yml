name: Publish App (reusable)

# Workflow reutilizável que o CI de um repositório de app chama, de uma org ou de uma conta
# pessoal: este repositório é público, então o `uses:` entre donos diferentes funciona e o
# checkout do script sai no `github.token` do chamador, sem PAT.
#
#   jobs:
#     publish:
#       uses: colabhd/vssh-sdk/.github/workflows/_publish-app-reusable.yml@main
#       with:
#         app_dir: "."
#         repo_api: "https://vssh-repo.colabh.org"
#       secrets:
#         publish_token: ${{ secrets.VSSH_REPO_PUBLISH_TOKEN }}   # token escopado app:<id>
#
# Faz checkout do repositório do app (o chamador) e deste (só `scripts/`, `api/` e `runtime/`), e
# roda o `vssh-app-publish`.
#
# UM REPOSITÓRIO OU VÁRIOS:
#   Sem a variável `VSSH_SITIOS`, o job `publish` empacota e manda ao `repo_api`, num passo só.
#   Com ela, a publicação vai a cada sítio da lista. `VSSH_SITIOS` é uma variável da organização
#   (ou do repositório) do chamador, em JSON, com o nome, o endereço e o runner de cada sítio:
#
#     [{"nome":"franca","api":"http://vssh-repo.franca.exemplo","runner":"colabhd-franca"},
#      {"nome":"sp","api":"http://vssh-repo.sp.exemplo","runner":"colabhd-sp"}]
#
#   O job `publish` empacota uma vez (`--empacotar`), carimba a versão interna e guarda o lote como
#   artefato do run. Ele roda no `runner` do chamador e lê o repositório do primeiro sítio da lista
#   (a regra dos apps oficiais), então o primeiro sítio é um que aquele runner alcança. O job
#   `enviar` roda uma vez por sítio, no runner dele, e manda o mesmo lote ao endereço dele
#   (`--enviar`): todo sítio recebe os mesmos bytes e a mesma interna, e o pacote não sai da rede
#   do sítio. Um sítio que falha deixa o job dele vermelho, com o nome, e não desfaz os outros.
#   Reexecutar só os jobs que falharam manda o mesmo lote, com a mesma interna. O token é o mesmo
#   em todo sítio: quem administra o registra em cada repositório pelo hash (`POST /v1/tokens` do
#   `vssh-repo`).
#
#   Com a lista, o `repo_api` do chamador não recebe nada. O repositório da Cloudflare continua
#   recebendo enquanto for uma entrada dela, com um runner da nuvem.
#
# POR QUE `main`:
#   O que o publish valida é o `api/vssh-app.schema.json`, e esse arquivo é gerado pelo sistema a
#   partir do portal que está no ar (ver README.md). A ponta de `main` responde "o portal de hoje
#   aceita este manifesto?", que é a pergunta de quem publica; uma tag congelaria um contrato que
#   o portal já deixou para trás, e ninguém a moveria, porque quem escreve `api/` é um robô. O
#   `tools_ref` continua existindo para quem precisar fixar uma revisão.

on:
  workflow_call:
    inputs:
      app_dir:
        description: 'Diretório do app dentro do repo chamador'
        type: string
        default: '.'
      version:
        description: 'Sobrescreve a version do manifest (opcional)'
        type: string
        default: ''
      repo_api:
        description: 'Base URL do Worker do repositório'
        type: string
        required: true
      tools_ref:
        description: 'Ref deste repositório de onde puxar o script de publish (precisa conter api/)'
        type: string
        default: 'main'
      notes:
        description: 'Notas de versão em markdown (o que mudou nesta versão), para a ficha do app na loja. Ex.: github.event.release.body'
        type: string
        default: ''
      # O runner do job. Um app de uma organização sem orçamento de Actions passa o scale set
      # próprio dela (`colabhd-franca`, no colabhd); o padrão continua o da nuvem, para quem chama
      # de uma conta pessoal, que não enxerga o scale set de ninguém.
      runner:
        description: 'O runner do job (runs-on): o padrão é o da nuvem; ex.: colabhd-franca'
        type: string
        default: 'ubuntu-latest'
    secrets:
      publish_token:
        description: 'Token de publicação escopado (app:<id> ou kind:app)'
        required: true

jobs:
  publish:
    name: Publish app no repositório de artefatos
    runs-on: ${{ inputs.runner }}
    # Um publish leva poucos minutos, com o Chrome e o palco do app. O teto é para o que trava (um
    # Worker que não responde, um upload que para no meio), que sem ele seguraria o runner por seis
    # horas, e no scale set de uma organização o runner é de todos os repositórios dela.
    timeout-minutes: 15
    steps:
      # O `vssh-app-publish` valida o manifesto com `python3`. O `ubuntu-latest` o traz de fábrica; a
      # imagem de um runner próprio costuma ter só git, curl e jq, e sem ele o publish morre antes de
      # empacotar. Uma fonte do apt fora do ar (um PPA da imagem do runner) faz o `apt-get update`
      # sair com erro depois de atualizar as outras, e o pacote ainda instala com elas.
      - name: python3, se a imagem do runner não tiver
        run: |
          command -v python3 >/dev/null && exit 0
          sudo apt-get update -qq || echo "::warning::uma fonte do apt não respondeu; a instalação segue com os índices das outras"
          sudo apt-get install -y -qq --no-install-recommends python3

      # O Node compila a pasta de ajuda do app (`contributes.ajuda`) com o compilador de `api/ajuda/`,
      # que é TypeScript apagável e pede o 22.18 ou mais novo. Os binários oficiais recentes do Node
      # carregam a `libatomic.so.1`, que a imagem mínima de um runner próprio não traz. Os dois passos
      # podem falhar sem derrubar a publicação: sem um Node que rode, o app publica sem a ajuda no
      # repositório, e o publish diz isso numa anotação.
      - name: libatomic1, para o Node, se a imagem do runner não tiver
        continue-on-error: true
        run: |
          ldconfig -p 2>/dev/null | grep -q 'libatomic\.so\.1' && exit 0
          sudo apt-get update -qq || echo "::warning::uma fonte do apt não respondeu; a instalação segue com os índices das outras"
          sudo apt-get install -y -qq --no-install-recommends libatomic1

      - name: Node, para compilar a ajuda do app
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # O palco do app abre a janela num Chrome e tira as figuras da ajuda dos passos. O
      # `ubuntu-latest` traz o Chrome; a imagem de um runner próprio não traz, e sem ele a ajuda sai
      # sem figura nenhuma. O passo pode falhar sem derrubar a publicação, e sem Chrome o publish diz
      # numa anotação que as figuras ficaram de fora.
      - name: Chrome, para as figuras da ajuda
        continue-on-error: true
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            command -v "$c" >/dev/null && exit 0
          done
          curl -fsSLo "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq || echo "::warning::uma fonte do apt não respondeu; a instalação segue com os índices das outras"
          sudo apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP/chrome.deb"
          google-chrome --version

      - name: Checkout do app (repo chamador)
        uses: actions/checkout@v5
        with:
          path: app

      - name: Checkout das ferramentas do vssh-sdk (scripts, api, runtime)
        uses: actions/checkout@v5
        with:
          repository: colabhd/vssh-sdk
          ref: ${{ inputs.tools_ref }}
          # `api` junto de `scripts`: o vssh-app-publish valida o manifesto contra
          # api/vssh-app.schema.json. Sem ele o script cai nas checagens mínimas
          # (id/runtime/entrypoint) e diz isso numa anotação do run, em vez de recusar a
          # publicação. `runtime/` vai para o palco do app, que sobe o backend dele para tirar as
          # figuras da ajuda; o publish não confere versão de lib, porque as libs de backend são o
          # runtime que o servidor tem, e o app não as leva.
          sparse-checkout: |
            scripts
            api
            runtime
          path: _tools
          # Repositório público: o github.token do chamador o enxerga sem PAT.

      - name: Publicar
        if: ${{ vars.VSSH_SITIOS == '' }}
        env:
          VSSH_REPO_API: ${{ inputs.repo_api }}
          VSSH_REPO_PUBLISH_TOKEN: ${{ secrets.publish_token }}
          # Pelo ambiente, e não interpolado no `run`: o corpo de um release tem aspas, crases e
          # cifrões, e qualquer um deles dentro do script viraria sintaxe.
          VSSH_RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          # Sem a lista, o app vai a um repositório só. Depois da virada (VSSH-670) as estações leem
          # o repositório do sítio delas, e uma publicação só na Cloudflare não chega a ninguém: o
          # aviso diz isso no run, porque a variável da organização some sem erro quando a
          # visibilidade dela não inclui este repositório.
          echo "::warning::A variável VSSH_SITIOS da organização não chegou a este repositório: o app vai só a ${VSSH_REPO_API}."
          ARGS=()
          [ -n "${{ inputs.version }}" ] && ARGS+=(--version "${{ inputs.version }}")
          bash _tools/scripts/vssh-app-publish "app/${{ inputs.app_dir }}" "${ARGS[@]}"

      # Com a lista de sítios, este job só empacota: o lote vira artefato do run, e o job `enviar`
      # o manda a cada sítio. O token não entra aqui, porque empacotar não escreve no repositório.
      - name: Empacotar
        if: ${{ vars.VSSH_SITIOS != '' }}
        env:
          VSSH_REPO_API: ${{ fromJSON(vars.VSSH_SITIOS || '[{}]')[0].api }}
          VSSH_RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          ARGS=()
          [ -n "${{ inputs.version }}" ] && ARGS+=(--version "${{ inputs.version }}")
          bash _tools/scripts/vssh-app-publish "app/${{ inputs.app_dir }}" --empacotar "$RUNNER_TEMP/lote" "${ARGS[@]}"

      - name: Guardar o lote
        if: ${{ vars.VSSH_SITIOS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lote-do-app
          path: ${{ runner.temp }}/lote
          if-no-files-found: error
          retention-days: 7

  enviar:
    name: Enviar a ${{ matrix.sitio.nome }}
    if: ${{ vars.VSSH_SITIOS != '' }}
    needs: publish
    strategy:
      # Um sítio que falha não cancela o envio aos outros.
      fail-fast: false
      matrix:
        sitio: ${{ fromJSON(vars.VSSH_SITIOS || '[{}]') }}
    runs-on: ${{ matrix.sitio.runner }}
    # O envio é o pacote, a ajuda com as figuras, o ícone e o ladrilho. O teto é para o sítio que
    # aceita a conexão e não responde.
    timeout-minutes: 10
    steps:
      # A conferência da interna lê o manifesto que o sítio serve com `python3`.
      - name: python3, se a imagem do runner não tiver
        run: |
          command -v python3 >/dev/null && exit 0
          sudo apt-get update -qq || echo "::warning::uma fonte do apt não respondeu; a instalação segue com os índices das outras"
          sudo apt-get install -y -qq --no-install-recommends python3

      - name: Checkout do script de publicação do vssh-sdk
        uses: actions/checkout@v5
        with:
          repository: colabhd/vssh-sdk
          ref: ${{ inputs.tools_ref }}
          sparse-checkout: |
            scripts
          path: _tools

      - name: Baixar o lote
        uses: actions/download-artifact@v4
        with:
          name: lote-do-app
          path: lote

      - name: Enviar
        env:
          VSSH_REPO_API: ${{ matrix.sitio.api }}
          VSSH_SITIO: ${{ matrix.sitio.nome }}
          VSSH_REPO_PUBLISH_TOKEN: ${{ secrets.publish_token }}
        run: bash _tools/scripts/vssh-app-publish --enviar lote
